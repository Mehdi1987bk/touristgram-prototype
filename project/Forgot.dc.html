<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#8A979C}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;color:#16262B;overflow:hidden;padding:24px 24px 32px">

  <a href="Auth.dc.html" aria-label="Back" style="width:40px;height:40px;margin-left:-8px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#16262B">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>

  <div style="margin-top:26px;display:flex;flex-direction:column;gap:8px">
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.4px">Forgot password?</div>
    <div style="font-size:14.5px;color:#5C6B70;font-weight:500;line-height:1.5">Enter the email linked to your touristgram account and we'll send you a reset link.</div>
  </div>

  <div style="margin-top:28px;display:flex;flex-direction:column;gap:7px">
    <label for="email" style="font-size:12.5px;font-weight:700;color:#2E4B74">Email</label>
    <input id="email" type="email" placeholder="you@example.com" style="box-sizing:border-box;width:100%;padding:14px 16px;border:1.5px solid #D5E0E3;border-radius:14px;font-family:inherit;font-size:15px;color:#16262B;background:#FFFFFF">
  </div>

  <sc-if value="{{notSent}}" hint-placeholder-val="true">
    <button onClick="{{send}}" style="margin-top:22px;box-sizing:border-box;width:100%;padding:16px;border:none;border-radius:16px;background:#1565D8;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:800;text-align:center;cursor:pointer">Send reset link</button>
  </sc-if>

  <sc-if value="{{sent}}" hint-placeholder-val="">
    <div style="margin-top:22px;display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:#E5F3EA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M4 12.5l5 5L20 7"/></svg>
      <span style="font-size:13px;font-weight:700;color:#2E7D4F;line-height:1.45">Reset link sent to you@example.com</span>
    </div>
    <a href="Auth.dc.html" style="margin-top:12px;box-sizing:border-box;padding:16px;border-radius:16px;background:#1565D8;color:#FFFFFF;font-size:16px;font-weight:800;text-align:center">Back to sign in</a>
    <button onClick="{{resend}}" style="margin-top:12px;box-sizing:border-box;width:100%;padding:14px;border:1.5px solid #D5E0E3;border-radius:16px;background:#FFFFFF;color:#2E4B74;font-family:inherit;font-size:14px;font-weight:800;text-align:center;cursor:pointer">{{resendLabel}}</button>
  </sc-if>

  <div style="margin-top:20px;display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:14px;background:#E8F1FD">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D47A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
    <span style="font-size:12.5px;font-weight:600;color:#0D47A8;line-height:1.5">{{hintText}}</span>
  </div>

  <div style="flex:1"></div>

  <div style="display:flex;justify-content:center;gap:6px;font-size:13.5px;font-weight:600;color:#5C6B70">
    Remember your password?
    <a href="Auth.dc.html" style="color:#1565D8;font-weight:800">Sign in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false, resends: 0 };
  }
  renderVals() {
    const sent = this.state.sent;
    const resends = this.state.resends;
    return {
      sent: sent,
      notSent: !sent,
      resendLabel: resends === 0 ? 'Resend link' : 'Link resent (' + resends + ')',
      hintText: sent
        ? "Can't find it? Check your spam folder, then resend the link."
        : "The email usually arrives within a minute. Check your spam folder if you don't see it.",
      send: () => this.setState({ sent: true }),
      resend: () => this.setState({ resends: this.state.resends + 1 })
    };
  }
}
</script>
</body>
</html>
