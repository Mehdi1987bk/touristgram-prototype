<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder,textarea::placeholder{color:#8A979C}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;color:#16262B;overflow:hidden">

  <div style="flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid #EDF2F3;box-sizing:border-box">
    <a href="Profile.dc.html" aria-label="Back" style="width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#16262B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span style="flex:1;font-size:16.5px;font-weight:800">Edit profile</span>
    <a href="Profile.dc.html" style="font-size:14px;font-weight:800;color:#1565D8;padding:8px 4px">Save</a>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:22px 24px 0;gap:18px;box-sizing:border-box">

    <button onClick="{{togglePhoto}}" aria-label="Change photo" style="display:flex;flex-direction:column;align-items:center;gap:10px;align-self:center;border:none;padding:0;margin:0;background:none;font-family:inherit;cursor:pointer;color:#16262B">
      <span style="width:92px;height:92px;border-radius:46px;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;{{avatarBg}}">TG</span>
      <span style="font-size:13px;font-weight:800;color:#1565D8">{{photoLabel}}</span>
    </button>

    <div style="display:flex;flex-direction:column;gap:7px">
      <label for="name" style="font-size:12.5px;font-weight:700;color:#2E4B74">Name</label>
      <input id="name" value="Tahir Guliyev" style="box-sizing:border-box;width:100%;padding:14px 16px;border:1.5px solid #D5E0E3;border-radius:14px;font-family:inherit;font-size:15px;color:#16262B;background:#FFFFFF">
    </div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <label for="user" style="font-size:12.5px;font-weight:700;color:#2E4B74">Username</label>
      <label for="user" style="display:flex;align-items:center;gap:2px;padding:14px 16px;border:1.5px solid #D5E0E3;border-radius:14px;box-sizing:border-box;cursor:text">
        <span style="font-size:15px;color:#8A979C;font-weight:600">@</span>
        <input id="user" value="tahir.guliyev" style="flex:1;border:none;background:none;font-family:inherit;font-size:15px;color:#16262B;outline:none;min-width:0">
      </label>
    </div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <label for="bio" style="font-size:12.5px;font-weight:700;color:#2E4B74">Bio</label>
      <textarea id="bio" rows="3" style="box-sizing:border-box;width:100%;padding:14px 16px;border:1.5px solid #D5E0E3;border-radius:14px;font-family:inherit;font-size:14.5px;line-height:1.5;color:#16262B;background:#FFFFFF;resize:none">Into history, food and beaches. Next stop — Istanbul 🇹🇷</textarea>
      <span style="align-self:flex-end;font-size:11.5px;font-weight:600;color:#8A979C">54 / 150</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <label for="city" style="font-size:12.5px;font-weight:700;color:#2E4B74">City</label>
      <input id="city" value="Baku" style="box-sizing:border-box;width:100%;padding:14px 16px;border:1.5px solid #D5E0E3;border-radius:14px;font-family:inherit;font-size:15px;color:#16262B;background:#FFFFFF">
    </div>

    <span style="font-size:12px;color:#8A979C;font-weight:600;line-height:1.5">Your name and username are visible to everyone. Your city is used to suggest destinations near you.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { photoChanged: false };
  }
  renderVals() {
    const changed = this.state.photoChanged;
    return {
      photoLabel: changed ? 'Photo updated' : 'Change photo',
      avatarBg: changed ? 'background:#1565D8' : 'background:#0D47A8',
      togglePhoto: () => this.setState({ photoChanged: !this.state.photoChanged })
    };
  }
}
</script>
</body>
</html>
