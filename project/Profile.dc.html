<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile · touristgram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;color:#16262B;overflow:hidden">

  <div style="flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box;position:relative;z-index:4">
    <button onClick="{{toggleAccount}}" aria-label="Account menu" style="padding:0;background:none;border:none;font-family:inherit;font-size:17px;font-weight:800;text-align:left;cursor:pointer;{{accountNameStyle}}">@tahir.guliyev</button>
    <a href="Settings.dc.html" aria-label="Settings" style="padding:8px;display:flex;color:#16262B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><circle cx="9" cy="7" r="2.3" fill="#FFFFFF"/><path d="M4 17h16"/><circle cx="15" cy="17" r="2.3" fill="#FFFFFF"/></svg>
    </a>
    <sc-if value="{{accountOpen}}" hint-placeholder-val="">
      <div style="position:absolute;left:16px;top:50px;width:188px;padding:6px;box-sizing:border-box;border-radius:14px;background:#FFFFFF;border:1px solid #E3EBED;box-shadow:0 12px 26px rgba(13,30,60,0.16);display:flex;flex-direction:column;gap:2px">
        <a href="Notifications.dc.html" style="padding:9px 10px;border-radius:10px;background:#F7FAFB;font-size:12.5px;font-weight:800;color:#16262B">Notifications</a>
        <a href="EditProfile.dc.html" style="padding:9px 10px;border-radius:10px;background:#F7FAFB;font-size:12.5px;font-weight:800;color:#16262B">Edit profile</a>
        <a href="Auth.dc.html" style="padding:9px 10px;border-radius:10px;background:#FDF3F2;font-size:12.5px;font-weight:800;color:#C2402A">Log out</a>
      </div>
    </sc-if>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:4px 16px 0;gap:14px;box-sizing:border-box">

    <div style="display:flex;align-items:center;gap:18px">
      <a href="EditProfile.dc.html" aria-label="Change photo" style="flex:none;width:84px;height:84px;border-radius:42px;background:#0D47A8;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">TG</a>
      <div style="flex:1;display:flex;justify-content:space-between">
        <a href="Post.dc.html" aria-label="Open your latest post" style="display:flex;flex-direction:column;align-items:center;gap:1px"><span style="font-size:17px;font-weight:800">42</span><span style="font-size:11.5px;font-weight:700;color:#5C6B70">posts</span></a>
        <a href="UserProfile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:1px"><span style="font-size:17px;font-weight:800">318</span><span style="font-size:11.5px;font-weight:700;color:#5C6B70">followers</span></a>
        <a href="MapView.dc.html" aria-label="Travel map" style="display:flex;flex-direction:column;align-items:center;gap:1px"><span style="font-size:17px;font-weight:800">7</span><span style="font-size:11.5px;font-weight:700;color:#5C6B70">countries</span></a>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:15.5px;font-weight:800">Tahir Guliyev</span>
      <span style="font-size:13px;color:#5C6B70;font-weight:600;line-height:1.5">Baku · into history, food and beaches. Next stop — Istanbul 🇹🇷</span>
      <div style="display:flex;gap:6px;padding-top:2px">
        <a href="Explore.dc.html" style="padding:6px 11px;border-radius:14px;background:#E8F1FD;font-size:11px;font-weight:800;color:#0D47A8">History</a>
        <a href="Explore.dc.html" style="padding:6px 11px;border-radius:14px;background:#E8F1FD;font-size:11px;font-weight:800;color:#0D47A8">Food</a>
        <a href="Explore.dc.html" style="padding:6px 11px;border-radius:14px;background:#E8F1FD;font-size:11px;font-weight:800;color:#0D47A8">Beaches</a>
      </div>
    </div>

    <div style="display:flex;gap:10px">
      <a href="EditProfile.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;padding:12px;border:1.5px solid #D5E0E3;border-radius:14px;font-size:13px;font-weight:800;color:#16262B;box-sizing:border-box">Edit profile</a>
      <a href="Trips.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;padding:12px;border-radius:14px;background:#1565D8;color:#FFFFFF;font-size:13px;font-weight:800;box-sizing:border-box">My trips</a>
    </div>

    <div style="display:flex;gap:8px;align-items:stretch">
      <a href="Booking.dc.html" style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#E8F1FD;border:1.5px solid #BBD7F7;box-sizing:border-box">
        <span style="flex:none;width:34px;height:34px;border-radius:17px;background:#1565D8;display:flex;align-items:center;justify-content:center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6h18v6"/><path d="M3 12V7"/><path d="M21 18v2"/><path d="M3 18v2"/><path d="M7 12V9h5v3"/></svg>
        </span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:12.5px;font-weight:800;color:#0D47A8">Hotel confirmed</span>
          <span style="font-size:11px;font-weight:600;color:#2E4B74;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sirkeci Mansion · Nov 14–17</span>
        </span>
      </a>
      <a href="Hotel.dc.html" style="flex:none;width:108px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#1565D8;color:#FFFFFF;font-size:12px;font-weight:800;white-space:nowrap;box-sizing:border-box">Book a hotel</a>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:18px;border-bottom:1.5px solid #EDF2F3">
        <button onClick="{{showPosts}}" style="padding:8px 2px;font-size:13px;background:none;border:none;font-family:inherit;cursor:pointer;{{postsTabStyle}}">Posts</button>
        <button onClick="{{showMap}}" style="padding:8px 2px;font-size:13px;background:none;border:none;font-family:inherit;cursor:pointer;{{mapTabStyle}}">Travel map</button>
        <button onClick="{{showTagged}}" style="padding:8px 2px;font-size:13px;background:none;border:none;font-family:inherit;cursor:pointer;{{taggedTabStyle}}">Tagged</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="font-size:11.5px;font-weight:700;color:#5C6B70">{{tabHint}}</span>
        <a href="{{tabActionHref}}" style="font-size:11.5px;font-weight:800;color:#1565D8;white-space:nowrap">{{tabAction}}</a>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px">
        <a href="{{tileHref}}" aria-label="{{tileLabel}}" style="aspect-ratio:1;border-radius:10px;background:url('../blob/{{tile1}}') center/cover;display:block"></a>
        <a href="{{tileHref}}" aria-label="{{tileLabel}}" style="aspect-ratio:1;border-radius:10px;background:url('../blob/{{tile2}}') center/cover;display:block"></a>
        <a href="{{tileHref}}" aria-label="{{tileLabel}}" style="aspect-ratio:1;border-radius:10px;background:url('../blob/{{tile3}}') center/cover;display:block"></a>
        <a href="{{tileHref}}" aria-label="{{tileLabel}}" style="aspect-ratio:1;border-radius:10px;background:url('../blob/{{tile4}}') center/cover;display:block"></a>
        <a href="{{tileHref}}" aria-label="{{tileLabel}}" style="aspect-ratio:1;border-radius:10px;background:url('../blob/{{tile5}}') center/cover;display:block"></a>
        <a href="{{tileHref}}" aria-label="{{tileLabel}}" style="aspect-ratio:1;border-radius:10px;background:url('../blob/{{tile6}}') center/cover;display:block"></a>
      </div>
    </div>
  </div>

  <div style="flex:none;height:84px;border-top:1px solid #E3EBED;background:#FFFFFF;display:flex;padding:8px 6px 16px;box-sizing:border-box">
    <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5C6B70;font-size:10.5px;font-weight:600">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Home</span>
    </a>
    <a href="Explore.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5C6B70;font-size:10.5px;font-weight:600">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11z"/></svg>
      <span>Explore</span>
    </a>
    <a href="AI.dc.html" aria-label="AI assistant" style="flex:1;display:flex;align-items:center;justify-content:center">
      <span style="width:54px;height:54px;margin-top:-26px;border-radius:27px;background:#1565D8;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(21,101,216,0.32)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none" aria-hidden="true"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 14.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>
      </span>
    </a>
    <a href="Trips.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5C6B70;font-size:10.5px;font-weight:600">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      <span>Trips</span>
    </a>
    <a href="Profile.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#1565D8;font-size:10.5px;font-weight:700">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: "posts", accountOpen: false };
  }
  renderVals() {
    const tab = this.state.tab;
    const accountOpen = this.state.accountOpen;
    const active = "border-bottom:2.5px solid #1565D8;font-weight:800;color:#1565D8";
    const idle = "border-bottom:2.5px solid transparent;font-weight:700;color:#8A979C";
    const hints = {
      posts: "42 posts · newest first",
      map: "7 countries · Turkey, Georgia, Spain +4",
      tagged: "9 posts you were tagged in"
    };
    const actions = {
      posts: "New post",
      map: "Show on map",
      tagged: "See all"
    };
    const actionHrefs = {
      posts: "CreatePost.dc.html",
      map: "MapView.dc.html",
      tagged: "Explore.dc.html"
    };
    const tileHrefs = {
      posts: "Post.dc.html",
      map: "Destination.dc.html",
      tagged: "Post.dc.html"
    };
    const tileLabels = {
      posts: "Open post",
      map: "Open destination",
      tagged: "Open tagged post"
    };
    const img1 = "286253317834a930566f50e2a20d570d";
    const img2 = "ec51dbee552a2b1ab3464e5696665f32";
    const img3 = "6aa376d4f9a4ee9f4b7a33ac9e7dff12";
    const img4 = "e22005ac848fb280065be5dfba06f680";
    const img5 = "f880968ed022cc3ac462152cd746d20d";
    const img6 = "8cdb7b77fd4432882535a53bf210f493";
    const grids = {
      posts: [img1, img2, img3, img4, img5, img6],
      map: [img3, img5, img1, img6, img2, img4],
      tagged: [img2, img4, img6, img1, img3, img5]
    };
    const grid = grids[tab];
    const pickTab = (next) => () => this.setState({ tab: next, accountOpen: false });
    return {
      postsTabStyle: tab === "posts" ? active : idle,
      mapTabStyle: tab === "map" ? active : idle,
      taggedTabStyle: tab === "tagged" ? active : idle,
      showPosts: pickTab("posts"),
      showMap: pickTab("map"),
      showTagged: pickTab("tagged"),
      accountOpen: accountOpen,
      accountNameStyle: accountOpen ? "color:#1565D8" : "color:#16262B",
      toggleAccount: () => this.setState({ accountOpen: !accountOpen }),
      tabHint: hints[tab],
      tabAction: actions[tab],
      tabActionHref: actionHrefs[tab],
      tileHref: tileHrefs[tab],
      tileLabel: tileLabels[tab],
      tile1: grid[0],
      tile2: grid[1],
      tile3: grid[2],
      tile4: grid[3],
      tile5: grid[4],
      tile6: grid[5]
    };
  }
}
</script>
</body>
</html>
