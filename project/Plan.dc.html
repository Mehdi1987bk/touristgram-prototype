<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>План поездки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F7FAFB;font-family:'Manrope',system-ui,sans-serif;color:#16262B;overflow:hidden">

  <div style="flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#FFFFFF;border-bottom:1px solid #EDF2F3">
    <a href="AI.dc.html" aria-label="Назад к ассистенту" style="width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#16262B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex:1;display:flex;flex-direction:column">
      <span style="font-size:16px;font-weight:800">Стамбул · 3 дня</span>
      <span style="font-size:11.5px;font-weight:600;color:#5C6B70">14–17 ноября · средний бюджет</span>
    </div>
    <span style="padding:6px 11px;border-radius:14px;background:#E8F1FD;font-size:11.5px;font-weight:800;color:#0D47A8">версия 2</span>
  </div>

  <div style="flex:none;display:flex;gap:8px;padding:12px 16px 4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" style="flex:1;padding:11px 8px;border-radius:14px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:12px 16px;box-sizing:border-box">
    <div style="font-size:13px;font-weight:800;color:#2E4B74">{{dayTitle}}</div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <div style="display:flex;gap:12px;padding:13px 14px;border-radius:16px;background:#FFFFFF;border:1px solid #E3EBED">
        <span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:48px">
          <span style="font-size:13px;font-weight:800;color:#0D47A8">{{it.time}}</span>
          <span style="font-size:10px;font-weight:700;color:#8A979C">{{it.dur}}</span>
        </span>
        <span style="width:1.5px;background:#E3EBED;border-radius:1px"></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">
          <span style="font-size:14px;font-weight:800">{{it.title}}</span>
          <span style="font-size:12px;color:#5C6B70;font-weight:600;line-height:1.45">{{it.note}}</span>
        </span>
      </div>
    </sc-for>
    <a href="Place.dc.html" style="align-self:flex-start;font-size:12.5px;font-weight:800;color:#1565D8;padding:2px 2px">Открыть карточку места →</a>
    <span style="font-size:11px;color:#8A979C;font-weight:600;line-height:1.5">Маршрут можно править вручную — правки сохранятся при перегенерации. Подтверждённые брони план не трогает.</span>
  </div>

  <div style="flex:none;display:flex;gap:12px;padding:14px 16px 26px;background:#FFFFFF;border-top:1px solid #EDF2F3">
    <a href="Trips.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;padding:15px;border:1.5px solid #1565D8;border-radius:16px;font-size:14px;font-weight:800;color:#1565D8;box-sizing:border-box">Сохранить</a>
    <a href="Hotel.dc.html" style="flex:1.5;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:16px;background:#1565D8;color:#FFFFFF;font-size:14px;font-weight:800;box-sizing:border-box">
      Отель на эти даты
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 0 };
    this.days = [
      {
        title: 'День 1 · 14 ноября · Султанахмет',
        items: [
          { time: '09:00', dur: '1,5 ч', title: 'Голубая мечеть', note: 'Бесплатно. Закрытая одежда, платки выдают на входе.' },
          { time: '11:00', dur: '2 ч', title: 'Собор Святой Софии', note: 'Билет онлайн заранее — очередь в кассы до часа.' },
          { time: '13:30', dur: '1 ч', title: 'Обед · кёфте у Султанахмета', note: 'Средний чек 12–15 €. Из постов: @murad.trip советует Tarihi Köftecisi.' },
          { time: '15:00', dur: '2 ч', title: 'Цистерна Базилика и прогулка', note: 'Прохладно внутри — возьмите кофту.' }
        ]
      },
      {
        title: 'День 2 · 15 ноября · Бейоглу и Босфор',
        items: [
          { time: '10:00', dur: '1,5 ч', title: 'Галатская башня', note: 'Лучший свет для фото — ближе к закату, но утром меньше людей.' },
          { time: '12:00', dur: '2 ч', title: 'Истикляль и Таксим', note: 'Ретро-трамвай, кафе, магазины.' },
          { time: '15:00', dur: '1,5 ч', title: 'Круиз по Босфору', note: 'Короткий маршрут от Эминёню, ~10 €.' },
          { time: '19:00', dur: '2 ч', title: 'Ужин с видом на Босфор', note: 'Районы Ортакёй или Каракёй — бронь столика желательна.' }
        ]
      },
      {
        title: 'День 3 · 16 ноября · базары и вкусы',
        items: [
          { time: '09:30', dur: '2 ч', title: 'Гранд-базар', note: 'Закрыт в воскресенье — поэтому поставлен на субботу.' },
          { time: '12:00', dur: '1,5 ч', title: 'Египетский базар и специи', note: 'Рядом набережная Эминёню — балык-экмек на обед.' },
          { time: '14:30', dur: '2 ч', title: 'Кулинарная прогулка по Кадыкёю', note: 'Азиатская сторона: паром 20 минут, по пути — виды города.' },
          { time: '18:00', dur: '1 ч', title: 'Кофе и десерты · Караköй', note: 'Пахлава в Karaköy Güllüoğlu — классика.' }
        ]
      }
    ];
  }
  renderVals() {
    const day = this.state.day;
    const tabs = ['День 1', 'День 2', 'День 3'].map((label, i) => ({
      label: label,
      style: i === day
        ? 'background:#1565D8;color:#FFFFFF;border:1.5px solid #1565D8'
        : 'background:#FFFFFF;color:#2E4B74;border:1.5px solid #D5E0E3',
      pick: () => this.setState({ day: i })
    }));
    return { tabs: tabs, items: this.days[day].items, dayTitle: this.days[day].title };
  }
}
</script>
</body>
</html>
