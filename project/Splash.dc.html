<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>touristgram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;background:#0D47A8;font-family:'Manrope',system-ui,sans-serif;color:#FFFFFF;overflow:hidden;padding:0 32px 48px">

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px">
    <a href="Auth.dc.html" aria-label="Open touristgram" style="display:flex;flex-direction:column;align-items:center;gap:22px;cursor:pointer">
      <span style="width:118px;height:118px;border-radius:34px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <img src="../blob/a8cf475331f03a0dea5c244fc42a98b7" alt="touristgram logo" style="width:86px;height:86px;object-fit:contain">
      </span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div style="font-size:34px;font-weight:800;letter-spacing:-0.5px">touristgram</div>
        <div style="font-size:15px;font-weight:600;color:#BBD7F7;text-align:center;line-height:1.5">Discover. Plan.<br><span style="color:#FFFFFF;font-weight:700">Book hotels.</span> Share.</div>
      </div>
    </a>
  </div>

  <div style="flex:none;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center">
    <a href="Auth.dc.html" style="width:100%;box-sizing:border-box;padding:16px;border-radius:16px;background:#FFFFFF;color:#0D47A8;font-size:16px;font-weight:800;text-align:center;cursor:pointer">Start your journey</a>
    <a href="Main.dc.html" style="font-size:13px;font-weight:700;color:#BBD7F7;cursor:pointer">Continue as guest</a>
    <div style="display:flex;flex-direction:column;align-items:center">
      <button onClick="{{toggleBuild}}" style="box-sizing:border-box;border:none;background:transparent;padding:0;margin:0;font-family:inherit;font-size:12px;color:{{verColor}};font-weight:600;cursor:pointer">Version 1.0 · touristgram prototype</button>
      <sc-if value="{{showBuild}}" hint-placeholder-val="">
        <span style="margin-top:8px;font-size:11px;font-weight:700;color:#BBD7F7;text-align:center">Build 2026.10 · Istanbul demo · hotels from €54</span>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showBuild: false };
  }
  renderVals() {
    const open = this.state.showBuild;
    return {
      showBuild: open,
      verColor: open ? '#FFFFFF' : '#8FB8EF',
      toggleBuild: () => this.setState({ showBuild: !open })
    };
  }
}
</script>
</body>
</html>
