<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore — find places</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#8A979C}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;font-family:'Manrope',system-ui,sans-serif;color:#16262B;overflow:hidden">

  <div style="flex:none;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="Search.dc.html" style="flex:1;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;background:#F2F6F7">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5C6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600;color:#8A979C">Where to next?</span>
      </a>
      <a href="MapView.dc.html" aria-label="Open map" style="flex:none;width:44px;height:44px;border:1.5px solid #D5E0E3;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#1565D8;box-sizing:border-box">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
      </a>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" style="flex:none;padding:9px 14px;border-radius:20px;font-family:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:18px 16px 0;gap:20px;box-sizing:border-box">

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:17px;font-weight:800">Popular destinations</span>
        <a href="Search.dc.html" style="font-size:12.5px;font-weight:700;color:#1565D8">See all</a>
      </div>
      <div style="display:flex;gap:12px">
        <a href="Destination.dc.html" style="flex:1;display:flex;flex-direction:column;gap:8px">
          <span style="display:block;height:150px;border-radius:16px;background:url('../blob/ceb7a8f77c69fddfeaa82fa0e76c51e2') center/cover"></span>
          <span style="display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14.5px;font-weight:800">Istanbul</span>
            <span style="font-size:12px;color:#5C6B70;font-weight:600">Turkey · 4,820 posts</span>
          </span>
        </a>
        <a href="Destination.dc.html" style="flex:1;display:flex;flex-direction:column;gap:8px">
          <span style="display:block;height:150px;border-radius:16px;background:url('../blob/ee236cc2b00df42663bb3cf65c2b4e92') center/cover"></span>
          <span style="display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14.5px;font-weight:800">Dubai</span>
            <span style="font-size:12px;color:#5C6B70;font-weight:600">UAE · 3,140 posts</span>
          </span>
        </a>
      </div>
    </div>

    <a href="Hotel.dc.html" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:#E8F1FD;border:1.5px solid #CFE2FB;box-sizing:border-box">
      <span style="flex:none;width:48px;height:48px;border-radius:14px;background:url('../blob/ceb7a8f77c69fddfeaa82fa0e76c51e2') center/cover"></span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
        <span style="font-size:14.5px;font-weight:800;color:#0D47A8">Book your stay in Istanbul</span>
        <span style="font-size:11.5px;font-weight:600;color:#2E4B74">12 stays · from €54 / night</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1565D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:8px">
        <span style="font-size:17px;font-weight:800">{{sectionTitle}}</span>
        <a href="{{sectionHref}}" style="font-size:12.5px;font-weight:700;color:#1565D8">{{sectionLink}}</a>
      </div>

      <sc-for list="{{places}}" as="p" hint-placeholder-count="3">
        <a href="{{p.href}}" style="display:flex;align-items:center;gap:12px;padding:10px 0;{{p.sep}}">
          <span style="flex:none;width:56px;height:56px;border-radius:14px;background:url('../blob/{{p.img}}') center/cover"></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">
            <span style="font-size:14.5px;font-weight:700">{{p.title}}</span>
            <span style="font-size:12px;color:#5C6B70;font-weight:600">{{p.meta}}</span>
          </span>
          <span style="display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:#16262B">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8A13A" stroke="none" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></svg>
            {{p.rating}}
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="flex:none;height:84px;border-top:1px solid #E3EBED;background:#FFFFFF;display:flex;padding:8px 6px 16px;box-sizing:border-box">
    <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5C6B70;font-size:10.5px;font-weight:600">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Home</span>
    </a>
    <a href="Explore.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#1565D8;font-size:10.5px;font-weight:700">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11z"/></svg>
      <span>Explore</span>
    </a>
    <a href="AI.dc.html" aria-label="AI assistant" style="flex:1;display:flex;align-items:center;justify-content:center">
      <span style="width:54px;height:54px;margin-top:-26px;border-radius:27px;background:#1565D8;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(21,101,216,0.32)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none" aria-hidden="true"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 14.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>
      </span>
    </a>
    <a href="Trips.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5C6B70;font-size:10.5px;font-weight:600">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      <span>Trips</span>
    </a>
    <a href="Profile.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5C6B70;font-size:10.5px;font-weight:600">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 0 };
  }
  renderVals() {
    const f = this.state.filter;
    const imgCity = 'ceb7a8f77c69fddfeaa82fa0e76c51e2';
    const imgBay = 'ee236cc2b00df42663bb3cf65c2b4e92';
    const imgTower = 'b6ea639ab08578ff5eb49288041389df';
    const imgTea = '8cdb7b77fd4432882535a53bf210f493';
    const imgCenter = '6b1cf880accc646470dce38b75bf481b';

    const chips = ['All', 'Hotels', 'Food', 'Landmarks'].map((label, i) => ({
      label: label,
      style: i === f
        ? 'background:#1565D8;color:#FFFFFF;border:1.5px solid #1565D8'
        : 'background:#FFFFFF;color:#2E4B74;border:1.5px solid #D5E0E3',
      pick: () => this.setState({ filter: i })
    }));

    const heads = [
      { title: 'Near you · Baku', link: 'View map', href: 'MapView.dc.html' },
      { title: 'Hotels in Istanbul', link: 'See all', href: 'Hotel.dc.html' },
      { title: 'Food near you', link: 'View map', href: 'MapView.dc.html' },
      { title: 'Landmarks near you', link: 'View map', href: 'MapView.dc.html' }
    ];

    const lists = [
      [
        { title: 'Maiden Tower', meta: 'Landmark · 1.2 km', rating: '4.7', img: imgTower, href: 'Place.dc.html' },
        { title: 'Silk Road Tea House', meta: 'Cafe · 650 m · open till 11pm', rating: '4.5', img: imgTea, href: 'Place.dc.html' },
        { title: 'Heydar Aliyev Center', meta: 'Museum · 4.8 km', rating: '4.8', img: imgCenter, href: 'Place.dc.html' }
      ],
      [
        { title: 'Sirkeci Mansion', meta: '€120 / night · breakfast included', rating: '4.6', img: imgCity, href: 'Hotel.dc.html' },
        { title: 'Hotel Amira Istanbul', meta: '€138 / night · rooftop terrace', rating: '4.8', img: imgBay, href: 'Hotel.dc.html' },
        { title: 'Cheers Hostel Old City', meta: '€54 / night · budget pick', rating: '4.3', img: imgTea, href: 'Hotel.dc.html' }
      ],
      [
        { title: 'Silk Road Tea House', meta: 'Cafe · 650 m · open till 11pm', rating: '4.5', img: imgTea, href: 'Place.dc.html' },
        { title: 'Old City Grill House', meta: 'Grill · 1.4 km · open till 1am', rating: '4.6', img: imgCity, href: 'Place.dc.html' }
      ],
      [
        { title: 'Maiden Tower', meta: 'Landmark · 1.2 km', rating: '4.7', img: imgTower, href: 'Place.dc.html' },
        { title: 'Seaside Boulevard', meta: 'Viewpoint · 1.6 km · free', rating: '4.6', img: imgBay, href: 'Place.dc.html' },
        { title: 'Heydar Aliyev Center', meta: 'Museum · 4.8 km', rating: '4.8', img: imgCenter, href: 'Place.dc.html' }
      ]
    ];

    const rows = lists[f];
    const places = rows.map((p, i) => ({
      title: p.title,
      meta: p.meta,
      rating: p.rating,
      img: p.img,
      href: p.href,
      sep: i === rows.length - 1 ? '' : 'border-bottom:1px solid #EDF2F3'
    }));

    return {
      chips: chips,
      places: places,
      sectionTitle: heads[f].title,
      sectionLink: heads[f].link,
      sectionHref: heads[f].href
    };
  }
}
</script>
</body>
</html>
