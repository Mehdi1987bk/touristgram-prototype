<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { liked: false, saved: false, shared: false };
  }
  renderVals() {
    const liked = !!this.state.liked;
    const saved = !!this.state.saved;
    const shared = !!this.state.shared;
    return {
      liked: liked,
      notLiked: !liked,
      likes: String(liked ? 215 : 214),
      likeColor: liked ? '#E8590C' : '#16262B',
      saved: saved,
      notSaved: !saved,
      saveColor: saved ? '#1565D8' : '#16262B',
      shared: shared,
      shareColor: shared ? '#1565D8' : '#16262B',
      toggleLike: () => this.setState({ liked: !liked }),
      toggleSave: () => this.setState({ saved: !saved }),
      toggleShare: () => this.setState({ shared: !shared })
    };
  }
}
</script>
