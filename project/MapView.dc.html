<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;background:#DCE9F6;font-family:'Manrope',system-ui,sans-serif;color:#16262B;overflow:hidden">

  <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0" aria-hidden="true">
    <rect x="0" y="0" width="390" height="844" fill="#DCE9F6"/>
    <path d="M0 620 C 90 560 160 640 250 580 C 320 535 360 560 390 540 L 390 844 L 0 844 Z" fill="#B8D4F2"/>
    <path d="M-20 160 C 80 140 180 200 410 150" stroke="#FFFFFF" stroke-width="14" fill="none"/>
    <path d="M60 -20 C 90 180 70 420 130 700" stroke="#FFFFFF" stroke-width="11" fill="none"/>
    <path d="M-20 360 C 120 330 260 390 410 330" stroke="#FFFFFF" stroke-width="14" fill="none"/>
    <path d="M250 -20 C 230 160 290 360 250 590" stroke="#FFFFFF" stroke-width="11" fill="none"/>
    <path d="M-20 500 C 100 480 240 520 410 470" stroke="#FFFFFF" stroke-width="9" fill="none"/>
    <path d="M160 40 C 180 200 150 330 190 480" stroke="#FFFFFF" stroke-width="7" fill="none"/>
    <path d="M330 20 C 320 160 350 300 330 470" stroke="#FFFFFF" stroke-width="7" fill="none"/>
    <rect x="84" y="196" width="46" height="30" rx="5" fill="#C9DCF1"/>
    <rect x="170" y="240" width="36" height="46" rx="5" fill="#C9DCF1"/>
    <rect x="272" y="190" width="40" height="34" rx="5" fill="#C9DCF1"/>
    <rect x="104" y="390" width="52" height="34" rx="5" fill="#C9DCF1"/>
    <rect x="280" y="380" width="38" height="44" rx="5" fill="#C9DCF1"/>
    <rect x="196" y="520" width="44" height="30" rx="5" fill="#C9DCF1"/>
  </svg>

  <div style="position:absolute;top:14px;left:12px;right:12px;display:flex;align-items:center;gap:10px">
    <a href="Explore.dc.html" aria-label="Back" style="flex:none;width:42px;height:42px;border-radius:21px;background:#FFFFFF;box-shadow:0 4px 14px rgba(13,71,168,0.18);display:flex;align-items:center;justify-content:center;color:#16262B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="Search.dc.html" style="flex:1;display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:16px;background:#FFFFFF;box-shadow:0 4px 14px rgba(13,71,168,0.18)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5C6B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <span style="font-size:13.5px;font-weight:700">{{searchLabel}}</span>
    </a>
  </div>

  <div style="position:absolute;top:72px;left:12px;display:flex;gap:8px">
    <button onClick="{{onChip0}}" style="padding:8px 13px;border:none;border-radius:16px;background:{{chip0Bg}};color:{{chip0Color}};font-family:inherit;font-size:12px;font-weight:{{chip0Weight}};box-shadow:{{chip0Shadow}};cursor:pointer">{{chip0}}</button>
    <button onClick="{{onChip1}}" style="padding:8px 13px;border:none;border-radius:16px;background:{{chip1Bg}};color:{{chip1Color}};font-family:inherit;font-size:12px;font-weight:{{chip1Weight}};box-shadow:{{chip1Shadow}};cursor:pointer">{{chip1}}</button>
    <button onClick="{{onChip2}}" style="padding:8px 13px;border:none;border-radius:16px;background:{{chip2Bg}};color:{{chip2Color}};font-family:inherit;font-size:12px;font-weight:{{chip2Weight}};box-shadow:{{chip2Shadow}};cursor:pointer">{{chip2}}</button>
    <button onClick="{{onChip3}}" style="padding:8px 13px;border:none;border-radius:16px;background:{{chip3Bg}};color:{{chip3Color}};font-family:inherit;font-size:12px;font-weight:{{chip3Weight}};box-shadow:{{chip3Shadow}};cursor:pointer">{{chip3}}</button>
  </div>

  <button onClick="{{onPin0}}" aria-label="{{pin0Name}}" style="position:absolute;top:300px;left:116px;display:flex;flex-direction:column;align-items:center;border:none;background:transparent;padding:0;font-family:inherit;cursor:pointer">
    <span style="padding:6px 10px;border-radius:12px;background:{{pin0LabelBg}};color:{{pin0LabelColor}};font-size:11.5px;font-weight:800;box-shadow:{{pin0Shadow}}">{{pin0Name}}</span>
    <svg width="30" height="38" viewBox="0 0 30 38" aria-hidden="true"><path d="M15 1C8 1 2.5 6.5 2.5 13.5 2.5 23 15 37 15 37s12.5-14 12.5-23.5C27.5 6.5 22 1 15 1z" fill="{{pin0Fill}}" stroke="#FFFFFF" stroke-width="2"/><circle cx="15" cy="13.5" r="4.5" fill="#FFFFFF"/></svg>
  </button>
  <button onClick="{{onPin1}}" aria-label="{{pin1Name}}" style="position:absolute;top:430px;left:252px;display:flex;flex-direction:column;align-items:center;border:none;background:transparent;padding:0;font-family:inherit;cursor:pointer">
    <span style="padding:6px 10px;border-radius:12px;background:{{pin1LabelBg}};color:{{pin1LabelColor}};font-size:11.5px;font-weight:800;box-shadow:{{pin1Shadow}}">{{pin1Name}}</span>
    <svg width="34" height="42" viewBox="0 0 30 38" aria-hidden="true"><path d="M15 1C8 1 2.5 6.5 2.5 13.5 2.5 23 15 37 15 37s12.5-14 12.5-23.5C27.5 6.5 22 1 15 1z" fill="{{pin1Fill}}" stroke="#FFFFFF" stroke-width="2"/><circle cx="15" cy="13.5" r="4.5" fill="#FFFFFF"/></svg>
  </button>
  <button onClick="{{onPin2}}" aria-label="{{pin2Name}}" style="position:absolute;top:238px;left:296px;border:none;background:transparent;padding:0;line-height:0;font-family:inherit;cursor:pointer">
    <svg width="26" height="33" viewBox="0 0 30 38" aria-hidden="true"><path d="M15 1C8 1 2.5 6.5 2.5 13.5 2.5 23 15 37 15 37s12.5-14 12.5-23.5C27.5 6.5 22 1 15 1z" fill="{{pin2Fill}}" stroke="#FFFFFF" stroke-width="2"/><circle cx="15" cy="13.5" r="4.5" fill="#FFFFFF"/></svg>
  </button>
  <button onClick="{{onPin3}}" aria-label="{{pin3Name}}" style="position:absolute;top:520px;left:84px;border:none;background:transparent;padding:0;line-height:0;font-family:inherit;cursor:pointer">
    <svg width="26" height="33" viewBox="0 0 30 38" aria-hidden="true"><path d="M15 1C8 1 2.5 6.5 2.5 13.5 2.5 23 15 37 15 37s12.5-14 12.5-23.5C27.5 6.5 22 1 15 1z" fill="{{pin3Fill}}" stroke="#FFFFFF" stroke-width="2"/><circle cx="15" cy="13.5" r="4.5" fill="#FFFFFF"/></svg>
  </button>

  <a href="{{cardHref}}" style="position:absolute;left:12px;right:12px;bottom:24px;display:flex;gap:12px;padding:12px;border-radius:18px;background:#FFFFFF;box-shadow:0 10px 30px rgba(13,71,168,0.25)">
    <span style="flex:none;width:84px;height:84px;border-radius:14px;background:url('../blob/78637c05da54e44cd633d6e09c1a00f1') center/cover"></span>
    <span style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;padding:2px 0">
      <span style="font-size:15.5px;font-weight:800">{{title}}</span>
      <span style="font-size:12px;color:#5C6B70;font-weight:600">{{meta}}</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#E8A13A" stroke="none" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></svg>
        {{rating}} <span style="color:#5C6B70;font-weight:600">· {{dist}}</span>
      </span>
    </span>
    <span style="align-self:center;flex:none;padding:10px 14px;border-radius:12px;background:#1565D8;color:#FFFFFF;font-size:12.5px;font-weight:800">Open</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 0, sel: 1 };
  }
  renderVals() {
    const filters = ['All', 'Food', 'Hotels', 'Museums'];
    const searchLabels = ['Baku · nearby places', 'Baku · places to eat', 'Baku · nearby hotels', 'Baku · nearby museums'];
    const sets = [
      { href: 'Place.dc.html', items: [
        { name: 'Old City', meta: 'Landmark · Baku', rating: '4.8', dist: '650 m away' },
        { name: 'Maiden Tower', meta: 'Landmark · Old City', rating: '4.7', dist: '1.1 km away' },
        { name: 'Heydar Aliyev Center', meta: 'Museum · Baku', rating: '4.9', dist: '3.4 km away' },
        { name: 'Seaside Boulevard', meta: 'Viewpoint · Baku', rating: '4.6', dist: '1.2 km away' }
      ] },
      { href: 'Place.dc.html', items: [
        { name: 'Qaynana', meta: 'Restaurant · Old City', rating: '4.7', dist: '400 m away' },
        { name: 'Dolma', meta: 'Restaurant · Downtown', rating: '4.6', dist: '950 m away' },
        { name: 'Firuze', meta: 'Azerbaijani · Baku', rating: '4.5', dist: '1.9 km away' },
        { name: 'Chinar', meta: 'Asian · Seaside', rating: '4.6', dist: '1.4 km away' }
      ] },
      { href: 'Hotel.dc.html', items: [
        { name: 'Sahil Boutique', meta: 'Hotel · Old City', rating: '4.6', dist: '550 m away' },
        { name: 'Baku Plaza', meta: 'Hotel · Downtown', rating: '4.5', dist: '1.3 km away' },
        { name: 'Old Town Inn', meta: 'Hotel · Old City', rating: '4.4', dist: '900 m away' },
        { name: 'Caspian View', meta: 'Hotel · Seaside', rating: '4.7', dist: '1.5 km away' }
      ] },
      { href: 'Place.dc.html', items: [
        { name: 'Carpet Museum', meta: 'Museum · Seaside', rating: '4.6', dist: '1.0 km away' },
        { name: 'Art Museum', meta: 'Museum · Downtown', rating: '4.5', dist: '1.2 km away' },
        { name: 'Heydar Aliyev Center', meta: 'Museum · Baku', rating: '4.9', dist: '3.4 km away' },
        { name: 'Miniature Books', meta: 'Museum · Old City', rating: '4.8', dist: '700 m away' }
      ] }
    ];
    const f = this.state.filter;
    const sel = this.state.sel;
    const places = sets[f].items;
    const p = places[sel];
    const vals = {
      searchLabel: searchLabels[f],
      cardHref: sets[f].href,
      title: p.name,
      meta: p.meta,
      rating: p.rating,
      dist: p.dist
    };
    for (let i = 0; i < 4; i++) {
      const onChip = f === i;
      vals['chip' + i] = filters[i];
      vals['chip' + i + 'Bg'] = onChip ? '#1565D8' : '#FFFFFF';
      vals['chip' + i + 'Color'] = onChip ? '#FFFFFF' : '#2E4B74';
      vals['chip' + i + 'Weight'] = onChip ? '800' : '700';
      vals['chip' + i + 'Shadow'] = onChip ? '0 4px 12px rgba(21,101,216,0.3)' : '0 3px 10px rgba(13,71,168,0.14)';
      vals['onChip' + i] = () => this.setState({ filter: i });
      const active = sel === i;
      vals['pin' + i + 'Name'] = places[i].name;
      vals['pin' + i + 'Fill'] = active ? '#0D47A8' : '#1565D8';
      vals['pin' + i + 'LabelBg'] = active ? '#0D47A8' : '#FFFFFF';
      vals['pin' + i + 'LabelColor'] = active ? '#FFFFFF' : '#16262B';
      vals['pin' + i + 'Shadow'] = active ? '0 4px 12px rgba(13,71,168,0.35)' : '0 3px 10px rgba(13,71,168,0.2)';
      vals['onPin' + i] = () => this.setState({ sel: i });
    }
    return vals;
  }
}
</script>
</body>
</html>
